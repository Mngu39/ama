
name: RL Evaluation

on:
  workflow_dispatch:
    inputs:
      policy:
        description: "Python policy module"
        required: true
        default: "teams.template.random_baseline.eval_policy"
        type: string
      episodes:
        description: "Number of evaluation episodes"
        required: true
        default: "100"
        type: string
      seed:
        description: "Starting evaluation seed"
        required: true
        default: "100000"
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
          python -m pip install "pybind11==3.1.0"

      - name: Check CPU compatibility
        run: |
          uname -m
          grep -qm1 sse4_1 /proc/cpuinfo || {
            echo "SSE4.1 support is required."
            exit 1
          }

      - name: Build Python environment
        run: |
          g++ -std=c++20 -O2 -msse4.1 \
            -shared -fPIC \
            $(python -m pybind11 --includes) \
            core/*.cpp rl_env/bindings.cpp \
            -o "rl_env/puyo_cpp$(python -m pybind11 --extension-suffix)"

      - name: Evaluate policy
        env:
          POLICY: ${{ inputs.policy }}
          EPISODES: ${{ inputs.episodes }}
          SEED: ${{ inputs.seed }}
        run: |
          python -m evaluation.evaluate \
            --policy "$POLICY" \
            --episodes "$EPISODES" \
            --seed "$SEED"
